<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 李羿壮</title>
    <style>
        *{margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif;}
        body{background: #1e293b; color: #f8fafc;}
        /* 全局背景 */
        .bg{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(https://picsum.photos/id/119/1920/1080) center/cover;
            opacity: 0.06;
            z-index: -1;
        }
        /* 导航栏 */
        nav{
            width: 100%;
            padding: 18px 5%;
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(203, 213, 225, 0.15);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .nav-box{
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            font-size: 22px;
            font-weight: bold;
            color: #a78bfa;
        }
        .nav-a a{
            color: #cbd5e1;
            text-decoration: none;
            margin: 0 9px;
            padding: 5px 9px;
            border-radius: 4px;
            transition: 0.25s;
        }
        .nav-a a:hover{
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.12);
        }
        /* 主体容器 */
        .container{
            max-width: 860px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        /* 顶部配图区域 */
        .banner{
            width: 100%;
            height: 210px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 35px;
        }
        .banner img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 留言卡片 */
        .msg-card{
            background: rgba(30, 41, 59, 0.65);
            padding: 38px;
            border-radius: 14px;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .title{
            text-align: center;
            font-size: 26px;
            color: #a78bfa;
            margin-bottom: 20px;
        }
        .tip-text{
            text-align: center;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.7;
        }
        /* 输入框样式 */
        input, textarea{
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 8px;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, textarea:focus{
            border-color: #a78bfa;
        }
        textarea{
            height: 150px;
            resize: none;
        }
        /* 提交按钮 */
        .submit{
            width: 100%;
            padding: 14px;
            background: #8b5cf6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit:hover{
            background: #7c3aed;
        }
        /* 成功提示 */
        .success{
            display: none;
            margin-top: 22px;
            padding: 16px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            border-radius: 8px;
            text-align: center;
            color: #34d399;
        }
        /* 页脚 */
        footer{
            margin-top: 70px;
            padding: 25px 0;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <nav>
        <div class="nav-box">
            <div class="logo">李羿壮</div>
            <div class="nav-a">
                <a href="index.html">首页</a>
                <a href="about.html">关于我</a>
                <a href="hobby.html">兴趣爱好</a>
                <a href="contact.html">联系方式</a>
                <a href="message.html">留言板</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="banner">
            <img src="https://picsum.photos/id/122/1000/210" alt="留言板块配图">
        </div>

        <div class="msg-card">
            <h3 class="title">留言板块</h3>
            <p class="tip-text">在这里留下你的话语，无论是问候、建议还是交流，我都会认真查看~</p>

            <input type="text" id="username" placeholder="请输入你的昵称">
            <textarea id="msgText" placeholder="请输入留言内容..."></textarea>

            <button class="submit" onclick="submitMsg()">立即提交</button>
            <div class="success" id="succTip">✅ 留言提交成功，感谢你的互动！</div>
        </div>
    </div>

    <footer>© 2026 李羿壮 个人主页 版权所有</footer>

    <script>
        function submitMsg(){
            let name = document.getElementById("username").value.trim();
            let text = document.getElementById("msgText").value.trim();
            let tip = document.getElementById("succTip");

            if(!name){
                alert("请填写昵称！");
                return;
            }
            if(!text){
                alert("请填写留言内容！");
                return;
            }

            tip.style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("msgText").value = "";
        }
    </script>
</body>
</html>
