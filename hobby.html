        <div class="banner">

        <div class="card">
            <p>在忙碌的学习之余，我有着许多放松身心的爱好。平日里我十分喜欢听音乐，不同风格的歌曲能够舒缓压力，让我保持轻松愉悦的心情。</p>
            <p>运动也是我生活中不可缺少的一部分，课余时间我会和伙伴们一起锻炼，跑步、打球都是我的选择，坚持运动能让我拥有健康的体魄和饱满的精神状态。</p>
            <p>闲暇时候我也会观看影视视频，了解新鲜趣事，偶尔也会出门散步，感受生活中的美好。这些爱好丰富了我的课余生活，也让我的每一天都过得充实有趣。</p>
