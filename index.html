<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李羿壮 - 个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background:#050816;color:#fff;}
        /* 全局背景 */
        .bg{position:fixed;top:0;left:0;width:100%;height:100%;background:url(https://picsum.photos/id/20/1920/1080) center/cover;opacity:0.1;z-index:-1;}
        /* 导航栏 */
        nav{width:100%;padding:20px 5%;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:99;}
        .nav-box{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
        .logo{font-size:22px;font-weight:bold;color:#409eff;}
        .nav-a a{color:#ccc;text-decoration:none;margin:0 10px;padding:6px 10px;border-radius:6px;transition:0.3s;}
        .nav-a a:hover{color:#409eff;background:rgba(64,158,255,0.1);}
        /* 主体容器 */
        .container{max-width:1000px;margin:0 auto;padding:60px 20px;}
        /* 顶部横幅图片 */
        .banner{width:100%;height:280px;border-radius:12px;overflow:hidden;margin-bottom:40px;position:relative;box-shadow:0 8px 30px rgba(64,158,255,0.15);}
        .banner img{width:100%;height:100%;object-fit:cover;}
        .banner::after{content:"欢迎来到李羿壮的个人主页";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(to top,rgba(5,8,22,0.85),transparent 65%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:35px;font-size:32px;color:#fff;font-weight:bold;}
        /* 内容卡片 */
        .card{background:rgba(255,255,255,0.05);padding:35px;border-radius:12px;border:1px solid rgba(64,158,255,0.2);}
        .card p{color:#b0b8c4;line-height:2;font-size:16px;text-indent:2em;}
        /* 页脚 */
        footer{margin-top:80px;padding:30px 0;text-align:center;color:#888;border-top:1px solid rgba(255,255,255,0.1);}
    </style>
</head>
<body>
    <div class="bg"></div>
    <nav>
        <div class="nav-box">
            <div class="logo">李羿壮</div>
            <div class="nav-a">
                <a href="index.html">首页</a>
                <a href="about.html">关于我</a>
                <a href="hobby.html">兴趣爱好</a>
                <a href="contact.html">联系方式</a>
                <a href="message.html">留言板</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="banner">
            <img src="https://picsum.photos/id/28/1000/280" alt="首页封面图">
        </div>
        <div class="card">
            <p>大家好，很高兴你能浏览我的个人主页。这是一个简单又温馨的个人网站，在这里你可以全面了解我的基本信息、日常爱好以及联络方式。页面上方的导航栏可以自由切换各个板块，如果你有想法和建议，也可以前往留言板和我互动交流。希望我的主页能给你带来不错的体验！</p>
        </div>
    </div>

    <footer>© 2026 李羿壮 个人主页 版权所有</footer>
</body>
</html>
